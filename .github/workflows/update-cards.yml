name: Update profile cards
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch data and render cards
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: |
          mkdir -p data
          python scripts/fetch_contributions.py
          python scripts/render_readme_cards.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cards
          git diff --cached --quiet || (git commit -m "Refresh profile cards" && git push)
